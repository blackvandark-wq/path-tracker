<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Path Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f4f0;
      min-height: 100vh;
      padding: 12px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #app { display: flex; flex-direction: column; gap: 10px; max-width: 680px; margin: 0 auto; }

    #map {
      width: 100%; height: 380px;
      border-radius: 12px;
      border: 0.5px solid rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .map-badge {
      background: rgba(255,255,255,0.95);
      border: 0.5px solid rgba(0,0,0,0.1);
      border-radius: 20px;
      padding: 5px 11px;
      font-size: 12px;
      font-family: 'SF Mono', 'Fira Mono', monospace;
      color: #444;
      display: flex; align-items: center; gap: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    #status-dot { width:7px; height:7px; border-radius:50%; background:#aaa; flex-shrink:0; transition:background 0.3s; }
    #status-dot.active { background:#2d9e5f; animation:blink 1.5s infinite; }
    #status-dot.paused { background:#d97706; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .panel {
      background: #fff;
      border: 0.5px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      padding: 14px 16px;
    }

    #stats-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 7px;
      margin-bottom: 12px;
    }

    .stat-card {
      background: #f7f7f5;
      border-radius: 8px;
      padding: 8px 10px; text-align: center;
    }
    .stat-label { font-size: 11px; color: #888; margin-bottom: 3px; }
    .stat-value { font-size: 16px; font-weight: 500; color: #1a1a1a; font-family: 'SF Mono', monospace; }
    .stat-unit { font-size: 10px; color: #aaa; margin-top: 1px; }

    #btn-row { display: flex; gap: 8px; margin-bottom: 10px; }

    .btn {
      flex:1; height:40px;
      border-radius: 8px;
      border: 0.5px solid rgba(0,0,0,0.15);
      background: transparent; cursor: pointer;
      font-family: inherit; font-size:13px; font-weight:500;
      color: #1a1a1a;
      display:flex; align-items:center; justify-content:center; gap:6px;
      transition: background 0.12s, transform 0.08s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { background: #f5f5f3; }
    .btn:active { transform: scale(0.97); background: #efefed; }
    .btn.primary { background:#1a5c3a; border-color:#2d9e5f; color:#b7f0d0; }
    .btn.primary:hover { background:#236b45; }
    .btn:disabled { opacity:0.38; cursor:not-allowed; transform:none; }

    #bottom-row { display:flex; justify-content:space-between; align-items:center; }
    .text-btn {
      background:none; border:none; cursor:pointer;
      font-size:12px; color:#888;
      font-family: inherit;
      display:flex; align-items:center; gap:4px; padding:4px 0;
      -webkit-tap-highlight-color: transparent;
    }
    .text-btn:hover { color:#333; }

    #elev-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    #elev-title { font-size:13px; font-weight:500; color:#1a1a1a; display:flex; align-items:center; gap:6px; }

    #elev-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 7px; margin-bottom: 12px;
    }
    .elev-stat { background:#f7f7f5; border-radius:8px; padding:8px 10px; text-align:center; }
    .elev-stat-label { font-size:10px; color:#888; margin-bottom:2px; }
    .elev-stat-value { font-size:15px; font-weight:500; color:#1a1a1a; font-family:'SF Mono',monospace; }
    .elev-stat-unit { font-size:10px; color:#aaa; }

    #chart-wrap { height:130px; position:relative; }

    #sim-notice {
      background: #fffbeb;
      border: 0.5px solid #fcd34d;
      border-radius: 8px;
      padding: 8px 12px; font-size:12px; color:#92400e;
      display:none; align-items:center; gap:6px;
    }

    #no-elev-notice {
      font-size:11px; color:#aaa;
      display:none; align-items:center; gap:4px;
    }

    @media (max-width: 480px) {
      body { padding: 8px; }
      #map { height: 320px; }
      .stat-value { font-size: 14px; }
    }
  </style>
</head>
<body>

<div id="app">
  <h1><i class="ti ti-route" aria-hidden="true"></i> Path Tracker</h1>

  <div id="map"></div>

  <div id="sim-notice">
    <i class="ti ti-alert-triangle" aria-hidden="true"></i>
    GPS nicht verfügbar — Simulation aktiv (Dortmund, inkl. simulierter Höhe)
  </div>

  <div class="panel">
    <div id="stats-row">
      <div class="stat-card">
        <div class="stat-label"><i class="ti ti-ruler-measure" aria-hidden="true" style="font-size:11px"></i> Distanz</div>
        <div class="stat-value" id="stat-dist">0.00</div>
        <div class="stat-unit">km</div>
      </div>
      <div class="stat-card">
        <div class="stat-label"><i class="ti ti-clock" aria-hidden="true" style="font-size:11px"></i> Zeit</div>
        <div class="stat-value" id="stat-time">00:00</div>
        <div class="stat-unit">mm:ss</div>
      </div>
      <div class="stat-card">
        <div class="stat-label"><i class="ti ti-trending-up" aria-hidden="true" style="font-size:11px"></i> Tempo</div>
        <div class="stat-value" id="stat-speed">0.0</div>
        <div class="stat-unit">km/h</div>
      </div>
      <div class="stat-card">
        <div class="stat-label"><i class="ti ti-map-pin" aria-hidden="true" style="font-size:11px"></i> Punkte</div>
        <div class="stat-value" id="stat-pts">0</div>
        <div class="stat-unit">gesamt</div>
      </div>
    </div>

    <div id="btn-row">
      <button class="btn primary" id="btn-start" onclick="handleStart()">
        <i class="ti ti-player-play" aria-hidden="true"></i> Start
      </button>
      <button class="btn" id="btn-pause" onclick="handlePause()" disabled>
        <i class="ti ti-player-pause" aria-hidden="true"></i> Pause
      </button>
      <button class="btn" id="btn-stop" onclick="handleStop()" disabled>
        <i class="ti ti-square" aria-hidden="true"></i> Stop
      </button>
    </div>

    <div id="bottom-row">
      <button class="text-btn" onclick="handleCenter()">
        <i class="ti ti-focus-centered" aria-hidden="true"></i> Zentrieren
      </button>
      <button class="text-btn" onclick="exportGPX()">
        <i class="ti ti-download" aria-hidden="true"></i> GPX exportieren
      </button>
    </div>
  </div>

  <div class="panel">
    <div id="elev-header">
      <div id="elev-title">
        <i class="ti ti-mountain" aria-hidden="true" style="font-size:15px"></i>
        Höhenprofil
      </div>
      <div id="no-elev-notice">
        <i class="ti ti-info-circle" aria-hidden="true"></i>
        Keine Höhendaten vom GPS
      </div>
    </div>
    <div id="elev-stats">
      <div class="elev-stat">
        <div class="elev-stat-label"><i class="ti ti-location" aria-hidden="true" style="font-size:10px"></i> Aktuell</div>
        <div class="elev-stat-value" id="elev-current">—</div>
        <div class="elev-stat-unit">m ü. NN</div>
      </div>
      <div class="elev-stat">
        <div class="elev-stat-label"><i class="ti ti-arrow-up" aria-hidden="true" style="font-size:10px"></i> Aufstieg</div>
        <div class="elev-stat-value" id="elev-up">0</div>
        <div class="elev-stat-unit">m</div>
      </div>
      <div class="elev-stat">
        <div class="elev-stat-label"><i class="ti ti-arrow-down" aria-hidden="true" style="font-size:10px"></i> Abstieg</div>
        <div class="elev-stat-value" id="elev-down">0</div>
        <div class="elev-stat-unit">m</div>
      </div>
    </div>
    <div id="chart-wrap">
      <canvas id="elevChart"></canvas>
    </div>
  </div>
</div>

<script>
let map, routeLayer, startMarker, currentMarker, watchId;
let points = [], elevations = [], distances = [];
let tracking = false, paused = false;
let startTime = null, pauseOffset = 0, pauseStart = null, timerInterval = null;
let simInterval = null, usingSimulation = false;
let simLat = 51.5145, simLon = 7.4653, simAngle = Math.PI * 0.3, simElev = 86;
let elevChart = null, hasRealElev = false;
let totalUp = 0, totalDown = 0;

function initMap() {
  map = L.map('map', { zoomControl: true }).setView([51.5145, 7.4653], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);

  routeLayer = L.polyline([], { color:'#2d9e5f', weight:4, opacity:0.9, lineJoin:'round', lineCap:'round' }).addTo(map);

  const sc = L.control({ position:'topleft' });
  sc.onAdd = () => {
    const d = L.DomUtil.create('div','map-badge');
    d.innerHTML = '<div id="status-dot"></div><span id="status-text">Bereit</span>';
    return d;
  };
  sc.addTo(map);

  const cc = L.control({ position:'topright' });
  cc.onAdd = () => {
    const d = L.DomUtil.create('div','map-badge');
    d.style.cssText = 'flex-direction:column;align-items:flex-end;gap:2px;border-radius:8px';
    d.innerHTML = '<div id="lat-d">Lat: —</div><div id="lon-d">Lon: —</div><div id="acc-d" style="color:#aaa">Genauigkeit: —</div>';
    return d;
  };
  cc.addTo(map);
}

function initChart() {
  const ctx = document.getElementById('elevChart').getContext('2d');
  elevChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        data: [],
        borderColor: '#2d9e5f',
        backgroundColor: 'rgba(45,158,95,0.1)',
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.4,
        fill: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => Math.round(ctx.parsed.y) + ' m',
            title: ctx => distances[ctx[0].dataIndex] !== undefined ? distances[ctx[0].dataIndex].toFixed(2) + ' km' : ''
          },
          displayColors: false
        }
      },
      scales: {
        x: {
          ticks: { maxTicksLimit: 6, font:{size:10}, color:'#aaa',
            callback: (v,i) => distances[i] !== undefined ? distances[i].toFixed(1) : '' },
          grid: { color:'rgba(0,0,0,0.05)' },
          border: { display:false }
        },
        y: {
          ticks: { maxTicksLimit:5, font:{size:10}, color:'#aaa', callback: v => Math.round(v)+' m' },
          grid: { color:'rgba(0,0,0,0.05)' },
          border: { display:false }
        }
      }
    }
  });
}

function haversine(a, b) {
  const R=6371, dLat=(b[0]-a[0])*Math.PI/180, dLon=(b[1]-a[1])*Math.PI/180;
  return R*2*Math.asin(Math.sqrt(Math.sin(dLat/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)**2));
}

function totalDist() {
  let d=0; for(let i=1;i<points.length;i++) d+=haversine(points[i-1],points[i]); return d;
}

function updateElevChart() {
  if (!elevChart || elevations.length < 2) return;
  const step = Math.max(1, Math.floor(elevations.length / 80));
  const sampledElev = [], sampledDist = [], labels = [];
  let d = 0;
  for (let i = 0; i < elevations.length; i += step) {
    if (i > 0) d += haversine(points[Math.max(0,i-step)], points[i]);
    sampledElev.push(elevations[i]);
    sampledDist.push(d);
    labels.push(i);
  }
  distances = sampledDist;
  elevChart.data.labels = labels;
  elevChart.data.datasets[0].data = sampledElev;
  elevChart.update('none');
}

function addPoint(lat, lon, acc, alt) {
  const pt = [lat, lon];
  if (points.length > 0) {
    const prevElev = elevations[elevations.length-1];
    if (alt != null && prevElev != null) {
      const diff = alt - prevElev;
      if (diff > 0.5) totalUp += diff;
      else if (diff < -0.5) totalDown += Math.abs(diff);
    }
  }
  points.push(pt);
  elevations.push(alt != null ? alt : null);
  routeLayer.addLatLng(pt);

  if (!startMarker) {
    startMarker = L.circleMarker(pt, { radius:7, color:'#2d9e5f', fillColor:'#2d9e5f', fillOpacity:1, weight:2 }).addTo(map);
  }
  if (currentMarker) map.removeLayer(currentMarker);
  currentMarker = L.circleMarker(pt, { radius:6, color:'#fff', fillColor:'#2d9e5f', fillOpacity:1, weight:2 }).addTo(map);

  document.getElementById('lat-d').textContent = 'Lat: ' + lat.toFixed(5);
  document.getElementById('lon-d').textContent = 'Lon: ' + lon.toFixed(5);
  document.getElementById('acc-d').textContent = '±' + Math.round(acc) + ' m';
  document.getElementById('stat-pts').textContent = points.length;

  if (alt != null) {
    document.getElementById('elev-current').textContent = Math.round(alt);
    document.getElementById('elev-up').textContent = Math.round(totalUp);
    document.getElementById('elev-down').textContent = Math.round(totalDown);
    document.getElementById('no-elev-notice').style.display = 'none';
    hasRealElev = true;
    updateElevChart();
  } else if (!hasRealElev) {
    document.getElementById('no-elev-notice').style.display = 'flex';
  }
  updateStats();
}

function updateStats() {
  document.getElementById('stat-dist').textContent = totalDist().toFixed(2);
  if (startTime) {
    const el = (Date.now()-startTime-pauseOffset)/1000;
    const m=Math.floor(el/60), s=Math.floor(el%60);
    document.getElementById('stat-time').textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    const d = totalDist();
    document.getElementById('stat-speed').textContent = el>0 ? (d/(el/3600)).toFixed(1) : '0.0';
  }
}

function startGPS() {
  if (!navigator.geolocation) { startSim(); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      map.setView([pos.coords.latitude, pos.coords.longitude], 16);
      watchId = navigator.geolocation.watchPosition(
        p => {
          if (!tracking || paused) return;
          addPoint(p.coords.latitude, p.coords.longitude, p.coords.accuracy||5, p.coords.altitude);
          map.panTo([p.coords.latitude, p.coords.longitude]);
        },
        () => startSim(),
        { enableHighAccuracy:true, maximumAge:2000, timeout:6000 }
      );
    },
    () => startSim(),
    { enableHighAccuracy:true, timeout:6000 }
  );
}

function startSim() {
  usingSimulation = true;
  document.getElementById('sim-notice').style.display = 'flex';
  map.setView([simLat, simLon], 16);
  simInterval = setInterval(() => {
    if (!tracking || paused) return;
    simAngle += (Math.random()-0.4)*0.25;
    simLat += Math.cos(simAngle)*0.00007;
    simLon += Math.sin(simAngle)*0.00009;
    simElev += (Math.random()-0.45)*3;
    simElev = Math.max(60, Math.min(160, simElev));
    addPoint(simLat, simLon, 6, simElev);
    map.panTo([simLat, simLon]);
  }, 1200);
}

function resetUI() {
  points=[]; elevations=[]; distances=[]; totalUp=0; totalDown=0; hasRealElev=false;
  routeLayer.setLatLngs([]);
  if(startMarker){map.removeLayer(startMarker);startMarker=null;}
  if(currentMarker){map.removeLayer(currentMarker);currentMarker=null;}
  document.getElementById('stat-dist').textContent='0.00';
  document.getElementById('stat-time').textContent='00:00';
  document.getElementById('stat-speed').textContent='0.0';
  document.getElementById('stat-pts').textContent='0';
  document.getElementById('elev-current').textContent='—';
  document.getElementById('elev-up').textContent='0';
  document.getElementById('elev-down').textContent='0';
  if(elevChart){elevChart.data.labels=[];elevChart.data.datasets[0].data=[];elevChart.update('none');}
}

function handleStart() {
  if (tracking && paused) {
    paused=false; pauseOffset+=Date.now()-pauseStart;
    setStatus('active','Aufzeichnung...');
    document.getElementById('btn-pause').innerHTML='<i class="ti ti-player-pause"></i> Pause';
    document.getElementById('btn-pause').disabled=false;
    document.getElementById('btn-start').disabled=true;
    return;
  }
  resetUI();
  tracking=true; paused=false;
  startTime=Date.now(); pauseOffset=0;
  setStatus('active','Aufzeichnung...');
  document.getElementById('btn-start').disabled=true;
  document.getElementById('btn-pause').disabled=false;
  document.getElementById('btn-stop').disabled=false;
  timerInterval=setInterval(updateStats,1000);
  startGPS();
}

function handlePause() {
  if(!paused){
    paused=true; pauseStart=Date.now();
    setStatus('paused','Pausiert');
    document.getElementById('btn-pause').innerHTML='<i class="ti ti-player-play"></i> Weiter';
    document.getElementById('btn-start').disabled=false;
    document.getElementById('btn-start').innerHTML='<i class="ti ti-player-play"></i> Weiter';
  } else {
    paused=false; pauseOffset+=Date.now()-pauseStart;
    setStatus('active','Aufzeichnung...');
    document.getElementById('btn-pause').innerHTML='<i class="ti ti-player-pause"></i> Pause';
    document.getElementById('btn-start').disabled=true;
    document.getElementById('btn-start').innerHTML='<i class="ti ti-player-play"></i> Start';
  }
}

function handleStop() {
  tracking=false; paused=false;
  if(watchId) navigator.geolocation.clearWatch(watchId);
  if(simInterval) clearInterval(simInterval);
  if(timerInterval) clearInterval(timerInterval);
  setStatus('','Abgeschlossen');
  document.getElementById('btn-start').disabled=false;
  document.getElementById('btn-start').innerHTML='<i class="ti ti-player-play"></i> Neue Route';
  document.getElementById('btn-pause').disabled=true;
  document.getElementById('btn-stop').disabled=true;
  if(points.length>1) map.fitBounds(routeLayer.getBounds(),{padding:[30,30]});
}

function handleCenter() {
  if(points.length){const l=points[points.length-1];map.setView(l,map.getZoom());}
}

function setStatus(cls,text){
  document.getElementById('status-dot').className=cls;
  document.getElementById('status-text').textContent=text;
}

function exportGPX() {
  if(points.length<2){alert('Keine Route zum Exportieren.');return;}
  const trkpts = points.map((p,i)=>{
    const e = elevations[i];
    const elevTag = e!=null ? `<ele>${e.toFixed(1)}</ele>` : '';
    return `    <trkpt lat="${p[0].toFixed(6)}" lon="${p[1].toFixed(6)}">${elevTag}</trkpt>`;
  }).join('\n');
  const gpx=`<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="PathTracker">\n  <trk><name>Route</name><trkseg>\n${trkpts}\n  </trkseg></trk>\n</gpx>`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([gpx],{type:'application/gpx+xml'}));
  a.download='route.gpx'; a.click();
}

window.addEventListener('load', () => { initMap(); initChart(); });
</script>
</body>
</html>
